version: '3.8'

services:
  # Nginx 前端服务
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qm-photo-admin-prod
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-80}:80'
    volumes:
      # 如果需要自定义 Nginx 配置，可以挂载
      # - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 如果需要实时更新静态文件，可以挂载 dist 目录（不推荐生产环境）
      # - ./dist:/usr/share/nginx/html:ro
    networks:
      - qm-photo-network-prod
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost/']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  qm-photo-network-prod:
    external: true # 使用外部网络，需要先创建

